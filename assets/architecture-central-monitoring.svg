<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">Centralized bank CCTV network — 64 branches, head-office monitoring only</title>
<desc id="desc">Branches 1 to 64 contain IP cameras, switches, and routers only. Camera streams pass through WAN to central recording and a single monitoring room at head office. No local preview or screens in branches.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="navy" x1="0" x2="1"><stop stop-color="#0a3270"/><stop offset="1" stop-color="#1168b7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2364a6"/></marker>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#142b4a}.header{font-size:35px;font-weight:800}.sub{font-size:17px;fill:#526983}.label{font-size:18px;font-weight:750}.small{font-size:14px;fill:#3e5a7a}.box{fill:#fff;stroke:#cbdbee;stroke-width:2}.device{fill:#ebf4ff;stroke:#82b0e5;stroke-width:1.5}.line{fill:none;stroke:#2364a6;stroke-width:4;marker-end:url(#arrow)}.branchline{fill:none;stroke:#1b8a74;stroke-width:3}</style>
</defs>
<rect width="1400" height="840" fill="url(#bg)"/>
<text x="700" y="65" class="t header" text-anchor="middle">CENTRALIZED CCTV SURVEILLANCE SYSTEM</text>
<text x="700" y="98" class="t sub" text-anchor="middle">64 BANK BRANCHES • ONE CENTRAL MONITORING ROOM AT HEAD OFFICE</text>
<rect x="35" y="135" width="490" height="568" rx="22" class="box"/>
<rect x="35" y="135" width="490" height="52" rx="20" fill="url(#navy)"/>
<text x="280" y="169" font-family="Arial" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">DISTRIBUTED BANK BRANCHES (1–64)</text>
