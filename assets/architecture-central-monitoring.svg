<rect width="440" height="122" rx="14" class="device"/>
<text x="16" y="27" class="t label">BRANCH 01</text>
<circle cx="48" cy="65" r="20" fill="#fff" stroke="#1b8a74" stroke-width="3"/><circle cx="48" cy="65" r="7" fill="#1b8a74"/>
<path d="M72 65H130" class="branchline"/><rect x="130" y="47" width="110" height="36" rx="7" fill="#fff" stroke="#1b8a74" stroke-width="2"/>
