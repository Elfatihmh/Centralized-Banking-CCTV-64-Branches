<rect x="35" y="728" width="1330" height="79" rx="16" fill="#fff" stroke="#d0dff0" stroke-width="2"/>
<text x="700" y="758" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#103d70">NO BRANCH VIDEO PREVIEW • NO BRANCH VIEWING SCREENS</text>
<text x="700" y="785" class="t small" text-anchor="middle">Conceptual portfolio diagram • not a production network topology • no confidential addressing or branch locations</text>
